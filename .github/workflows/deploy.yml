name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # No --delete: the server holds files the repo does not track (uploads, CNAME...).
      # Retries: Hostinger occasionally resets SSH from some GitHub runner IPs (seen 2026-11-01).
      - name: Rsync site/ to Hostinger
        run: |
          for i in 1 2 3 4 5; do
            rsync -rlvz --itemize-changes \
              -e "ssh -i ~/.ssh/id_deploy -p 65002 -o ConnectTimeout=15" \
              --exclude='.git*' --exclude='.gstack' \
              --exclude='*backup*' --exclude='*.bak' --exclude='*.orig' \
              --exclude='preview-*' --exclude='reglage-*' --exclude='_mockup-*' \
              --exclude='*-test.html' --exclude='draft-*' --exclude='*.md' \
              --exclude='node_modules' \
              site/ u468434482@72.60.93.244:domains/tms81.fr/public_html/ && exit 0
            echo "Tentative $i echouee, nouvel essai dans $((i*10))s"
            sleep $((i*10))
          done
          exit 1

      - name: Check production
        run: |
          code=$(curl -sL -o /dev/null -w '%{http_code}' https://tms81.fr/)
          echo "tms81.fr -> HTTP $code"
          [ "$code" = "200" ]
